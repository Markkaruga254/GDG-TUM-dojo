[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gdg-tum-build-arena-backend"
version = "0.1.0"
description = "Backend API for GDG TUM Build Arena (Google Developer Groups on Campus, Technical University of Mombasa)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "GDG on Campus TUM" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0.30,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "S", "RUF"]
ignore = [
    # FastAPI dependency injection relies on calls in default arguments.
    "B008",
    # Hardcoded placeholder strings are configuration defaults, not secrets.
    "S105",
    "S106",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["postgres: tests that require a live PostgreSQL database"]
