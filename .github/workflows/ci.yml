# Continuous integration for the Build Arena platform.
#
# Mirrors the checks documented in CONTRIBUTING.md — keep both in sync:
#   backend/README.md#running-the-tests
#   frontend/README.md#testing
#
# The backend job runs pytest against disposable PostgreSQL service databases.
# TEST_MIGRATION_DATABASE_URL is set so the migration tests (upgrade, schema
# drift, downgrade) run instead of being skipped. GitHub API calls stay mocked:
# the suite never touches the network.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — pytest + Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: buildarena
          POSTGRES_PASSWORD: buildarena
          POSTGRES_DB: buildarena_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U buildarena -d buildarena_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://buildarena:buildarena@127.0.0.1:5433/buildarena_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://buildarena:buildarena@127.0.0.1:5433/buildarena_mig
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint and format (Ruff)
        run: |
          ruff check app tests scripts migrations
          ruff format --check app tests scripts migrations

      - name: Create migration test database
        env:
          PGPASSWORD: buildarena
        run: >-
          psql -h 127.0.0.1 -p 5433 -U buildarena -d postgres
          -c "CREATE DATABASE buildarena_mig"

      - name: Tests (pytest)
        run: pytest

  frontend:
    name: Frontend — Vitest + checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Typecheck (tsc -b)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build
