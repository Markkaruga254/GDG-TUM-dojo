<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta
      name="description"
      content="Build Arena by GDG TUM — ship real projects, get scored by automated evaluation, and climb the leaderboard."
    />
    <title>Build Arena · GDG TUM</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          if (localStorage.getItem("ba-theme") !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch (_) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
